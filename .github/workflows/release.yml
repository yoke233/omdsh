name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @deepseek-ai/dsh@0.1.7-rc.2
      - run: pnpm run check
      - run: pnpm run prepare
      - name: Verify tag matches package version
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Pack release asset
        run: |
          mkdir -p release
          pnpm pack --pack-destination release
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "./release/yoke233-omdsh-${GITHUB_REF_NAME#v}.tgz" --access public --provenance
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/yoke233-omdsh-*.tgz
