# @yoke233/omdsh bundle patch (declared by `dsh.bundle.patch`): applied over the
# dsh-base layer when this package appears in a profile's `dsh.profile.bundles`.
# Overrides base rows by id, moves agent-visible capabilities behind presets,
# and inserts the terminal front door plus its host services.
#
# The tui-startup provider parses the launcher's immutable cmdline snapshot
# (--resume/--session/--help). The TUI creates or resumes the initial agent and
# awaits its selected preset setup before starting terminal input.

- id: session-title-llm
  name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
  disabled: true

- id: agent-loop
  config: {}

- id: system-prompt
  config:
    personaPrefix: |
      You are a coding agent powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and
      factual.

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: !!js process.env.DEEPSEEK_BASE_URL
    thinking: enabled
    reasoningEffort: max

- id: fs-sandbox
  config:
    cwd: !!js process.cwd()

- id: tools
  config:
    mode: native

# Agent-visible tools and prompt contributors live inside the selected preset.
# Keep the registries and shared backends on the host plane, but disable the
# base rows that would otherwise leak duplicate services into preset scopes.
- id: tool-plugin-manager
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

- insert:
    - id: llm-tool-call-sanitizer
      name: '@yoke233/omdsh/llm-tool-call-sanitizer'

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: tmux-context
      name: '@deepseek-ai/dsh-tmux-context'
      config:
        refreshIntervalMs: 900000

    # Host-owned selection policy sampled when a preset mounts delegation tools.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    # Preset definitions are separate bundle patch layers so profile overrides
    # can address each declaration by row id.
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

    # Profile-owned provider: same first-prompt contract with persistent route settings.
    - id: session-title-llm-tui
      name: '@yoke233/omdsh/session-title'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 64
        timeoutMs: 60000

    - id: tui-prompt
      name: '@yoke233/omdsh/prompt'

    - id: tui-startup
      name: '@yoke233/omdsh/startup'

    # Historical in-process reload investigation (route A), superseded by the
    # omdsh supervisor respawn: /reload is handled inside the TUI row and needs
    # no service row. Keep the module source for the docs/RELOAD_ISSUE.md record.
    - id: tui-reload
      name: '@yoke233/omdsh/reload'
      disabled: true

    # WeChat (iLink) bridge: opt-in remote control via the official Tencent
    # WeChat channel. Enable this entry in a later profile patch when needed;
    # keeping it disabled avoids background receivers and account state by default.
    - id: wechat-ilink
      name: '@yoke233/omdsh/wechat'
      disabled: true

    - id: tui
      name: '@yoke233/omdsh'
      inject: [tuiStartup, approval, jobs]
      config:
        sessionId: !!js ctx.tuiStartup.sessionId ?? ctx.tuiStartup.resumeSessionId
        showReasoning: true
        maxToolOutputLines: 6
        defaultReasoningEffort: max
        title: dsh


    # Claude Code hooks bridge, mounted twice for a layered config: a
    # project-local row and a user-level row (each configPath is process-level
    # and read once; the plugin is not a Service, so multiple rows compose).
    # Both layers' hooks run on the same interception seams
    # (PreToolUse/PostToolUse/UserPromptSubmit/Stop/…) and a deny from either
    # layer wins on the waterfall. A missing or malformed file is contained —
    # the bridge warns and registers nothing. `ask` decisions route through
    # ctx.approval into the TUI approval dialog.
    # OMDSH_HOOKS_CONFIG overrides the project layer (e.g. point it at a
    # Claude Code settings.json whose `hooks` key should run on dsh).
    - id: hooks-claude-code
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: !!js process.env.OMDSH_HOOKS_CONFIG ?? './.claude/hooks.json'

    - id: hooks-claude-code-user
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: !!js dshHomePath('hooks.json')
